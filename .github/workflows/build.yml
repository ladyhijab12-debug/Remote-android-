name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish the APK as a release with this tag (e.g. v1.0); leave empty to skip"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APKs
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk TV-Remote.apk
          cp kredi/build/outputs/apk/debug/kredi-debug.apk Daftar-Kredi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidTvRemote-apk
          path: TV-Remote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Daftar-Kredi-apk
          path: Daftar-Kredi.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            TV-Remote.apk
            Daftar-Kredi.apk
          body: |
            - **TV-Remote.apk**: ريموت لتلفزيون Android TV / Google TV و Samsung. الجوال والتلفزيون لازم يكونون على نفس الواي فاي.
            - **Daftar-Kredi.apk**: دفتر الكريدي ديال الحانوت (الكليان، الكريدي، الخلاص، التذكير فالواتساب).
            حمّل الملف اللي بغيتي تحت وثبّتو على التيليفون (اسمح بالتثبيت من مصادر غير معروفة).
      - name: Unit tests
        # --continue: run every module's tests even when another module has a failure.
        run: ./gradlew --no-daemon --continue testDebugUnitTest
