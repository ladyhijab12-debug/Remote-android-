name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish the APK as a release with this tag (e.g. v1.0); leave empty to skip"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk TV-Remote.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk Swim-Watch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidTvRemote-apk
          path: TV-Remote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SwimWatch-apk
          path: Swim-Watch.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: TV Remote ${{ inputs.release_tag || github.ref_name }}
          files: |
            TV-Remote.apk
            Swim-Watch.apk
          body: |
            ريموت لتلفزيون Android TV / Google TV.
            حمّل ملف TV-Remote.apk تحت وثبّته على جوالك (اسمح بالتثبيت من مصادر غير معروفة).
            الجوال والتلفزيون لازم يكونون على نفس الواي فاي.

            Swim-Watch.apk: تطبيق السباحة لساعات Wear OS (Galaxy Watch Ultra) — شوف README لطريقة التثبيت.
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
